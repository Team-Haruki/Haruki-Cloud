# 歌曲：查曲、谱面、BPM、歌曲列表、歌曲奖励、进度、自制谱面。

[music.not_found]
description = "查歌曲时找不到匹配的歌曲（不确定区服时）。占位符：Query=用户写的歌曲名、别名或 ID，超过 30 个字截断。"
other = "未找到歌曲：“{{.Query}}”"

[music.not_found_unspecified]
description = "查歌曲时找不到匹配的歌曲，且没有可显示的查询内容（不确定区服时）。"
other = "未找到对应的歌曲"

[music.not_found_in_region]
description = "在某个区服查歌曲时找不到匹配的歌曲，提示可以加区服前缀查其他区服。占位符：Region=区服显示名；Query=用户写的歌曲名、别名或 ID，超过 30 个字截断。"
other = "{{.Region}}未找到歌曲：“{{.Query}}”\n查询其他区服的歌曲请加区服前缀，例如 /cn查曲"

[music.not_found_unspecified_in_region]
description = "在某个区服查歌曲时找不到匹配的歌曲，且没有可显示的查询内容。占位符：Region=区服显示名。"
other = "{{.Region}}未找到对应的歌曲\n查询其他区服的歌曲请加区服前缀，例如 /cn查曲"

[music.query_required]
description = "查歌曲但没有写要查的歌曲。"
other = "请写要查询的歌曲名、别名或歌曲 ID"

[music.no_match]
description = "按条件筛选歌曲（歌曲列表、歌曲奖励、歌曲排行）后没有结果。"
other = "没有符合条件的歌曲"

[music.no_jacket]
description = "查歌曲封面，但该歌曲没有可用的封面资源。"
other = "该歌曲没有可用的封面"

[music.no_chart_difficulty]
description = "该歌曲没有用户指定难度的谱面。占位符：Difficulty=难度显示名，例如 MASTER。"
other = "该歌曲没有 {{.Difficulty}} 难度的谱面"

[music.meta.missing]
description = "歌曲计算类指令（控分、歌曲排行、组卡）需要的谱面计算数据暂时没有该歌曲。"
other = "暂时没有该歌曲的谱面计算数据"

[music.ambiguous]
description = "查歌曲时有多首歌曲匹配，下面逐行列出候选。占位符：Candidates=候选列表，每行一首（music.ambiguous_candidate）。"
other = "匹配到多首歌曲，请改用下面的 music<ID> 查询：\n{{.Candidates}}"

[music.ambiguous_candidate]
description = "music.ambiguous 的候选列表里的一行。占位符：ID=歌曲 ID；Title=歌曲名（游戏数据原文）。"
other = "music{{.ID}}：{{.Title}}"

[music.bpm.positive]
description = "BPM 反查写的 BPM 小于等于 0。"
other = "BPM 必须大于 0"

[music.bpm.no_chart]
description = "BPM 反查没有结果。占位符：BPM=用户写的 BPM 数值。"
other = "没有找到 BPM 为 {{.BPM}} 的谱面"

[music.bpm.no_data]
description = "查歌曲 BPM，但该谱面没有可用的 BPM 数据。"
other = "该谱面没有可用的 BPM 数据"

[music.note_count.positive]
description = "物量反查写的物量小于等于 0。"
other = "物量必须大于 0"

[music.note_count.no_chart]
description = "物量反查没有结果。占位符：Count=物量。"
other = "没有找到物量为 {{.Count}} 的谱面"

[music.note_count.no_chart_difficulty]
description = "按难度的物量反查没有结果。占位符：Count=物量；Difficulty=难度显示名，例如 MASTER。"
other = "没有找到物量为 {{.Count}} 的 {{.Difficulty}} 谱面"

[music.custom_chart.jp_only]
description = "自制谱面只能在日服查询。占位符：Region=日服的区服显示名。"
other = "自制谱面只支持{{.Region}}，请加 jp 前缀查询"

[music.custom_chart.id_required]
description = "查自制谱面但没有写 28 位自制谱面 ID。"
other = "请写 28 位自制谱面 ID"

[music.custom_chart.fetch_failed]
description = "获取自制谱面数据失败（游戏数据服务出错）。"
other = "获取自制谱面数据失败，请稍后再试"

[music.custom_chart.invalid]
description = "获取到的自制谱面数据无法解析。"
other = "自制谱面数据无效，暂时无法显示"

[music.custom_chart.original_missing]
description = "自制谱面对应的原曲在游戏数据里不存在。"
other = "找不到自制谱面对应的原曲"

[music.custom_chart.not_found]
description = "找不到用户写的自制谱面 ID。"
other = "未找到对应的自制谱面"

[music.board.spec_invalid]
description = "歌曲排行里要关注的歌曲找不到，或参数格式不正确，作为 common.bad_param 的原因行。"
other = "找不到这首歌曲，或参数格式不正确"

[music.board.too_many_specs]
description = "歌曲排行关注的歌曲太多。占位符：Max=最多可关注的歌曲数。"
other = "最多只能关注 {{.Max}} 首歌曲"

[music.unreleased]
description = "查询的歌曲还没有上线。"
other = "该歌曲还未上线"

[music.note_count.required]
description = "物量反查没有写物量数值。"
other = "请写物量数值"

[music.bpm.query_required]
description = "BPM 查询没有写歌曲。"
other = "请写要查询 BPM 的歌曲名、别名或歌曲 ID"

[music.bpm.value_required]
description = "BPM 反查没有写 BPM 数值。"
other = "请写要反查的 BPM 数值，例如 200"

[music.bpm.value_invalid]
description = "BPM 反查写的 BPM 不是正数，作为 common.bad_param 的原因行。"
other = "BPM 应为正数，例如 200"

[music.ambiguous_list.detail]
description = "查曲匹配到多首歌曲时，候选列表图片的标题。"
other = "匹配到多首歌曲，请用歌曲 ID 查询，例如 /查曲 123"

[music.ambiguous_list.bpm]
description = "查 BPM 匹配到多首歌曲时，候选列表图片的标题。"
other = "匹配到多首歌曲，请用歌曲 ID 查询，例如 /查BPM 123"
