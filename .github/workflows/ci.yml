name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    uses: seiunx-dev/ci-templates/.github/workflows/go-ci.yml@v1
    with:
      staticcheck-command: go run -modfile=.github/tools/go.mod honnef.co/go/tools/cmd/staticcheck
      postgres-image: postgres:17-alpine
      # Spelled out instead of ${CI_POSTGRES_URL} (host "localhost"): the imagecache lifecycle
      # tests refuse any DSN whose host is not literally 127.0.0.1 or ::1.
      env: HARUKI_IMAGECACHE_TEST_DSN=postgres://postgres:postgres@127.0.0.1:5432/test?sslmode=disable
      # One race run produces the coverage (the old sonar.yml ran the suite a second time).
      # Same coverpkg set and 90% gate as the old Sonar job: generated ent code and the
      # database/ schemas are left out.
      coverage: true
      coverpkg-exclude: ^haruki-cloud/(database|ent)(/|$)
      coverage-threshold: "90"

  sonar:
    name: Sonar
    needs: [go]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      defer-moving-tags: true # push :sha-* right away; :main moves after CI OK (docker-tags)
      version-build-arg: VERSION # main-<sha7> on main; the release build passes the tag
      cache-backend: registry # :buildcache; the gha cache sat at the 10 GB quota
      cache-mode: max # keeps the builder stage (go mod download layer)
      pr-paths: |
        api/**
        cmd/**
        config/**
        data/**
        database/**
        ent/**
        internal/**
        utils/**
        version/**
        main.go
        go.mod
        go.sum
        Dockerfile
        .dockerignore
        .github/workflows/**

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [go, sonar, docker, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  docker-tags:
    name: Docker tags # :main follows only commits whose CI OK passed
    needs: [docker, ci-ok]
    # Explicit result check: the implicit success() also fails when any job upstream of ci-ok was
    # skipped (e.g. a PR-only job), which silently skipped this job on main.
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && needs.docker.outputs.deferred-tags != '' }}
    permissions:
      contents: read
      packages: write
    uses: seiunx-dev/ci-templates/.github/workflows/docker-retag.yml@v1
    with:
      image: ${{ needs.docker.outputs.image }}
      digest: ${{ needs.docker.outputs.digest }}
      tags: ${{ needs.docker.outputs.deferred-tags }}
