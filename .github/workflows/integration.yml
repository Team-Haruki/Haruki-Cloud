# Integration tests — run manually or when services are available.
# Enable by removing workflow_dispatch-only trigger once CI infra is ready.
name: Integration

on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: haruki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: haruki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haruki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration Tests
        env:
          HARUKI_RUN_INTEGRATION: "1"
          HARUKI_TEST_DB_URL: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_test sslmode=disable"
          HARUKI_TEST_REDIS_URL: "localhost:6379"
        run: go test -race -count=1 -timeout=10m ./integration/...
