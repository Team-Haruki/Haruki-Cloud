profile: "dev" # production / beta / temp / dev

node:
  name: ""       # optional node name, e.g. primary-cloud / vm100
  role: ""       # optional operational role, e.g. primary-cloud / secondary-cloud-standby
  read_only: false # set true on standby/recovering nodes to reject user/business DB writes

backend:
  host: "0.0.0.0"
  port: 6666
  ssl: false
  ssl_cert: ""
  ssl_key: ""
  log_level: "INFO"
  main_log_file: "main.log"
  # Any non-empty value enables the canonical structured HTTP access log.
  access_log: "structured"
  access_log_path: "access.log"
  accept_authorization: null
  accept_user_agent: null
  allow_insecure_internal_api: false
  api_cache_ttl: "300s"
  enable_trust_proxy: true
  trusted_proxies:
    - "127.0.0.0/8"
    - "::1/128"
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "100.64.0.0/10"
    - "10.0.0.0/8"
  proxy_header: "X-Forwarded-For"
  # Latest Haruki bot client version advertised via manifest API.
  # Can also be set via HARUKI_LATEST_CLIENT_VERSION env var.
  latest_haruki_client_version: ""

chunithm:
  enabled: true
  music_db_type: "postgres"
  music_db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_chunithm sslmode=disable"
  binding_db_type: "postgres"
  binding_db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_chunithm sslmode=disable"

pjsk:
  enabled: true
  db_type: "postgres"
  db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_pjsk sslmode=disable"
  # MySekai is disabled for CN region by default. Add platform+group_id
  # entries below to whitelist specific groups.
  allow_cn_mysekai:
    # - platform: "qq"
    #   group_id: "12345678"
    #   bot_id: "11451419"
  # Blocked CN MySekai requests warn three times per user, then stay silent.
  # Other features are unaffected; cn_mysekai_ban_duration is no longer used.

sekai:
  enabled: true
  db_type: "postgres"
  db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_sekai sslmode=disable"
  auto_migrate: false # SekaiAPI owns masterdata DB schema; enable only for local/dev bootstrap
  remote_sync:
    enabled: false
    source_db_type: "postgres"
    source_db_url: ""       # remote maintained haruki_sekai DB; keep reachable only over private network
    interval: "30m"         # set negative to disable background sync
    timeout: "15m"
    initial: false          # run one sync before Cloud opens its local sekai DB
    fail_startup: false     # when initial=true, exit if the first sync fails
    pg_dump_path: "pg_dump"
    pg_restore_path: "pg_restore"

redis:
  host: "localhost"
  port: 6379
  password: ""

hmes:
  # Public HTTP base URL used by Client for SSE delivery.
  # HMES is optional; when empty, subscriptions are still stored in Cloud but
  # Client will not receive real-time push connection actions.
  public_base_url: "http://127.0.0.1:7910"
  # Internal HTTP base URL used by Cloud to close stale SSE subscriptions.
  internal_base_url: "http://127.0.0.1:7910"
  internal_token: ""
  user_agent: "Haruki-Cloud"

censor:
  # Text censor — Baidu AI Content Censor
  baidu_api_key: ""
  baidu_secret: ""
  # Image censor — Tencent Cloud Image Moderation Service (IMS)
  tencent_secret_id: ""
  tencent_secret_key: ""
  tencent_region: "ap-guangzhou"   # IMS region; ap-guangzhou recommended
  tencent_biz_type: ""             # optional Biz type tag configured in Tencent console
  # Censor result database
  censor_db_type: "postgres"
  censor_db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_censor sslmode=disable"

haruki_bot:
  db_type: "postgres"
  db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_bot sslmode=disable"
  enable_registration: true
  turnstile_secret_key: "0x4AAAAAAxxxxxxxx"
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_username: "noreply@example.com"
  smtp_password: "your-smtp-password"
  smtp_from: "Haruki Bot <noreply@example.com>"
  credential_sign_token: "your-credential-sign-token-32chars"
  session_sign_token: "your-session-sign-token-32chars"
  internal_api_token: "your-internal-api-token"
  # Noise NK static keys. noise_private_key is the legacy single key (key id
  # "default") and stays primary when set. noise_keys lists additional keys
  # accepted during rotation; each needs a stable key_id clients can reference.
  # At least one key must be configured.
  noise_private_key: ""  # hex-encoded 32-byte X25519 private key
  noise_keys: []
  # - key_id: "cloud-noise-2026-09"
  #   private_key: ""      # hex-encoded 32-byte X25519 private key
  # Session lifetime for the Noise-wrapped AuthV3 endpoint (/api/v3/bot/:bot_id/auth).
  # Zero uses the default (1h); values are clamped to [1m, 30d].
  auth_v3_session_ttl: "1h"
  # Candidate collection window for choosing which Bot returns a shared command result.
  # Zero uses the runtime default (200ms); a negative duration disables response election.
  response_election_window: "200ms"
  # Learn which bots serve each group and skip the window entirely when only one
  # bot is expected (~90% of elections). Fail-safe: an over-counted roster falls
  # back to the full window; an under-counted one still yields exactly one
  # response. Members absent from 3 consecutive elections are demoted.
  response_election_roster: false
  # Replay protection for the Noise-encrypted bot channel. Every command
  # request must carry timestamp+nonce (default). Set true only as an
  # emergency rollback lever: requests without the fields are then accepted,
  # while nonces that are present are still validated.
  allow_requests_without_nonce: false
  # Accepted request timestamp skew and single-use nonce TTL. 0 = default (5m).
  request_nonce_window: "5m"
  # Trust signing (see docs/architecture.cn.md 5.1 "信任密钥集与签名").
  # manifest_signing_key is the ONLINE Ed25519 seed (hex, 32 bytes) that signs
  # command manifests; generate it with `cmd/trust-signer keygen` and list its
  # public key in the keyset under manifest_signing_keys. Empty = unsigned.
  manifest_signing_key: ""
  manifest_signing_key_id: ""
  # Offline-signed keyset envelope produced by `cmd/trust-signer sign --domain keyset`.
  # Served verbatim at GET /api/v3/trust/keyset; empty = route not mounted.
  trust_keyset_path: ""
  # Client build policy: release allowlist + revocations checked at AuthV3
  # login and on live sessions. Plain JSON, or a trust-signer envelope
  # (--domain release) when build_policy_root_public_key is set.
  # build_policy_mode: off | log-only | enforce (empty = log-only when a path
  # is set). Start with log-only and watch security events for build_rejected.
  build_policy_path: ""
  build_policy_mode: ""
  build_policy_root_public_key: ""

users_db:
  db_type: "postgres"
  db_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_users sslmode=disable"

moderation:
  # QQ accounts allowed to run /kill and /back. Empty means nobody can use them.
  admin_qq_ids: []

sekai_api:
  base_url: "https://api.sekai.haruki.example.com"
  # targets:
  #   - name: "sekai-a"
  #     base_url: "https://api-a.sekai.haruki.example.com"
  #     concurrency: 8
  #   - name: "sekai-b"
  #     base_url: "https://api-b.sekai.haruki.example.com"
  #     concurrency: 8
  token: "your-haruki-sekai-api-token"

toolbox:
  base_url: "https://toolbox.haruki.example.com"
  api_token: "your-haruki-toolbox-api-token"
  # user_agent: "HarukiCloud/1.0"
  # 私有 game-data 读取的条件拉取：请求携带 known_upload_time，数据未变化时
  # Toolbox 直接返回 304（不传输快照体）。要求 Toolbox 部署支持条件读取
  # （Haruki-Toolbox-Backend PR #58 及之后）；关闭时用 upload_time 探测模拟
  # 相同语义（旧的两跳流程）。
  conditional_fetch: false

tracker:
  base_url: "https://tracker.haruki.example.com"
  user_agent: "HarukiCloud/1.0"

pjsk_render:
  enabled: true
  drawing_base_url: "http://INTERNAL_IP_1:28000"
  # drawing_targets:
  #   - name: "vm100"          # same name across services => share one machine queue
  #     base_url: "http://INTERNAL_IP_1:28000"
  #     concurrency: 8
  #   - name: "vm101"
  #     base_url: "http://INTERNAL_IP_3:28000"
  #     concurrency: 8
  # Render cache: hits come from the PostgreSQL render index (image_cache.render_index.lookup_enabled);
  # the SQLite /cache service and its base_url/db_path/gc_interval/require_auth keys were removed.
  drawing_cache:
    storage_dir: "/data/haruki/cache/drawing"  # only seeds the legacy derivation of storage.cache
    ttl: "10m"                         # endpoint rules may override this (e.g. /sk uses 10s buckets)
  drawing_timeout: "30s"      # env HARUKI_PJSK_RENDER_DRAWING_TIMEOUT
  drawing_retry_count: 2      # env HARUKI_PJSK_RENDER_DRAWING_RETRY_COUNT
  # Drawing artifact mode (C13 directive headers; Drawing uploads the image and answers an ArtifactRef).
  # Rollout dial: enable one api path, watch, widen. Empty = off (byte responses exactly as before).
  drawing_artifact:
    endpoints: []             # e.g. ["api/pjsk/card/box"]; ["*"] = all (env HARUKI_PJSK_RENDER_DRAWING_ARTIFACT_ENDPOINTS, comma-separated)
    fetch_timeout: "10s"      # reading a ref's bytes back (env HARUKI_PJSK_RENDER_DRAWING_ARTIFACT_FETCH_TIMEOUT)
    artifact_timeout: "15s"   # added to drawing_timeout for encode + upload (env HARUKI_PJSK_RENDER_DRAWING_ARTIFACT_ARTIFACT_TIMEOUT)
  music_meta:
    refresh_interval: "30m"   # how often to re-check the upstream for music_metas updates
    output_dir: ""            # optional: persist music_metas*.json into this directory after updates
    source: "legacy"          # legacy = sekai-data.3-3.dev file layout; registry = Haruki master registry (/v1/metas/{region}/music_metas.json, omakase rows already included)
    base_url: ""              # required for source=registry (e.g. http://100.76.159.97:9998); optional mirror host for legacy
  sk_forecast:
    local_base_url: "http://100.109.13.111:18746"
    cache_path: "/data/haruki/cache/drawing/sk_forecast_cache.json"
  mysekai_housing_competition:
    cache_path: "/data/haruki/cache/drawing/mysekai_housing_competition_stats.json"
    refresh_interval: "10s"
  preview_3d:
    enabled: false
    engine_base_url: "http://haruki-3d-engine:8080"
    engine_base_urls: {}  # when non-empty, every requested region must have an engine URL
    static_relative_dir: "static_images/pjsk_3d_preview"
    static_output_dir: ""   # DEPRECATED: leave "" so captures publish through storage.static
    width: 1024
    height: 1024
    scale: 1.6666667
    timeout: "45s"
    registry_cache_ttl: "5m"
    capture_exists_ttl: "30s"
    capture_max_concurrency: 1
    capture_acquire_timeout: "10s"
    temporary_capture_ttl: "360h"
    capture_cache_version: "legacy-cloud-framing-v2"  # bump to invalidate all persistent 3D preview PNGs
    camera_preset: "capture"
    camera_profile: "legacy-cloud"
  user_snapshot:
    provider: "local_file"    # future: "internal_cloud"
    allow_fallback: true      # set false in production (Toolbox is sole source); true for dev/test
    user_json: ""
    mysekai_json: ""
    # music_meta_json is the legacy local fallback path; leave empty when music_meta loader is active
    music_meta_json: ""
  image_cache:
    uri: ""         # CDN base URL for generic image cache, e.g. "https://image-cache.example.com" (env HARUKI_PJSK_RENDER_IMAGE_CACHE_URI)
    dir: ""         # local filesystem directory for cached images (env HARUKI_PJSK_RENDER_IMAGE_CACHE_DIR)
    pg_url: "host=localhost port=5432 user=haruki password=changeme dbname=haruki_imagecache sslmode=disable"
    pg_max_open: 8              # index connection pool bound (env HARUKI_PJSK_RENDER_IMAGE_CACHE_PG_MAX_OPEN)
    render_index:
      # true: an unreachable pg_url / failed schema init stops startup; false: ERROR log, dedup off
      # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_RENDER_INDEX_REQUIRE_PG)
      require_pg: false
      # true: run the render index DDL at startup (widen image_cache_entries, create render_cache_index).
      # The ALTERs take a brief ACCESS EXCLUSIVE lock: enable for an off-peak restart.
      # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_RENDER_INDEX_DDL_ENABLED)
      ddl_enabled: false
      # true: the render cache reads render_cache_index (needs the DDL and an upgraded Drawing)
      # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_RENDER_INDEX_LOOKUP_ENABLED)
      lookup_enabled: false
      touch_interval: "60s"     # per-key sliding-TTL throttle (env HARUKI_PJSK_RENDER_IMAGE_CACHE_RENDER_INDEX_TOUCH_INTERVAL)
    # Per-node public image-cache hosts, keyed by Drawing node_name (env HARUKI_PJSK_RENDER_IMAGE_CACHE_HOSTS,
    # "cn09=https://...,cn01=https://..." or JSON). Empty derives {"default": uri}.
    hosts: {}
    #   cn09: "https://ic-cn09.example.com"
    #   cn01: "https://ic-cn01.example.com"
    host_order: []              # preferred order; empty = name sort (env HARUKI_PJSK_RENDER_IMAGE_CACHE_HOST_ORDER)
    hosts_probe_path: ""        # "" = no prober; e.g. "/" (env HARUKI_PJSK_RENDER_IMAGE_CACHE_HOSTS_PROBE_PATH)
    hosts_probe_interval: "30s" # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_HOSTS_PROBE_INTERVAL)
    # Image cache GC (needs pg_url): phase 1 deletes expired render_cache_index rows, phase 2 deletes
    # unreferenced garage image_cache_entries rows older than the retention window, then their
    # recorded cdn_path objects (rows first, objects second). legacy_disk rows and infinite-TTL
    # render rows are never collected. Enable with gc_dry_run: true, watch one cycle, then flip.
    gc_enabled: false             # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_GC_ENABLED)
    gc_dry_run: true              # SELECTs only, logs counts and samples (env HARUKI_PJSK_RENDER_IMAGE_CACHE_GC_DRY_RUN)
    gc_interval: "1h"             # (env HARUKI_PJSK_RENDER_IMAGE_CACHE_GC_INTERVAL)
    gc_batch: 500                 # rows per phase per cycle (env HARUKI_PJSK_RENDER_IMAGE_CACHE_GC_BATCH)
    gc_object_retention_days: 30  # keeps already-sent image links alive (env HARUKI_PJSK_RENDER_IMAGE_CACHE_GC_OBJECT_RETENTION_DAYS)
    legacy_redirect:
      # true: /ic/* answers 301 to image_cache.hosts (or uri) instead of serving image_cache.dir.
      # Keep it on for at least 30 days after the cutover (env HARUKI_PJSK_RENDER_IMAGE_CACHE_LEGACY_REDIRECT_ENABLED)
      enabled: false
  asset_dirs:
    # DEPRECATED (E1): Cloud no longer needs a local asset root. Leave primary "" and legacy []
    # and configure storage.{assets,user_upload,static} below. A populated primary is still
    # honoured only as the legacy derivation root for those three slots when they are unset.
    primary: ""
    legacy: []
    # Public asset base URLs (REQUIRED when pjsk_render is enabled): startup fails when both
    # assets_base_urls and the legacy single assets_base_url are empty.
    assets_base_url: ""         # legacy single value, used as a one-element list (env HARUKI_PJSK_RENDER_ASSETS_BASE_URL)
    assets_base_urls: []        # ordered per-node list (env HARUKI_PJSK_RENDER_ASSETS_BASE_URLS, comma-separated)
    #  - "https://assets-cn09.example.com"
    #  - "https://assets-cn01.example.com"
  storage:
    # Every slot is an Asset-Updater style provider block: provider (alias name), scheme (alias
    # kind; fs | s3, default fs, `local` is accepted as an alias of fs), endpoint / endpoints
    # (endpoints wins when both are set), tls, bucket, root (alias prefix), region,
    # access_key_id, secret_access_key, base_url (alias public_base_url), public_read,
    # path_style (default true) and options (unknown keys warn and are kept).
    # An absent slot falls back to the legacy root (asset_dirs.primary for assets / user_upload /
    # static, drawing_cache.storage_dir for cache, image_cache.dir for image_cache) and, if that
    # is empty too, the feature is off. fs roots must be absolute.
    # For the `assets` and `image_cache` slots on s3, root MUST stay "": the region / group lives
    # in the object key and Drawing writes cdn_path relative to the bucket root.
    # Explicit per-feature paths (sk_forecast.cache_path, mysekai_housing_competition.cache_path,
    # music_meta.output_dir, image_cache.dir) keep precedence over a slot; delete the explicit key
    # to move that cache onto the slot.
    # Env: HARUKI_PJSK_RENDER_STORAGE_<SLOT>_<FIELD>, e.g. HARUKI_PJSK_RENDER_STORAGE_IMAGE_CACHE_BUCKET,
    # _ENDPOINTS (comma-separated), _OPTIONS (key=value,key=value), _ACCESS_KEY_ID, _SECRET_ACCESS_KEY;
    # user_upload additionally _MIRROR_SCHEME/_MIRROR_ROOT/_MIRROR_BUCKET/_MIRROR_ENDPOINTS/_MIRROR_MODE.
    # assets:      { scheme: fs, root: "/asset" }
    # user_upload: { scheme: fs, root: "/asset" }
    # static:      { scheme: fs, root: "/asset" }
    # cache:       { scheme: fs, root: "/data/haruki/cache/cloud" }
    # image_cache: { scheme: fs, root: "/data/haruki/imagecache" }
    # Garage cutover shape:
    # image_cache:
    #   provider: garage
    #   scheme: s3
    #   endpoints: ["http://100.64.0.11:3900", "http://100.64.0.12:3900", "http://100.64.0.13:3900"]
    #   tls: false
    #   bucket: image-cache
    #   root: ""                      # MUST stay "" (Drawing's cdn_path is bucket-root relative)
    #   region: garage
    #   access_key_id: "GK..."
    #   secret_access_key: "..."
    #   public_read: true
    #   path_style: true
    #   # typed s3 options: request_timeout (10s), dial_timeout (3s), stat_timeout (5s),
    #   # failover_cooldown (30s), max_attempts (one per endpoint), max_object_bytes (67108864),
    #   # proxy (none | environment)
    #   options: { request_timeout: "10s", dial_timeout: "3s", proxy: none }
    # profile_bg dual-write during the flip (release R6), then delete `mirror`:
    # user_upload:
    #   scheme: s3
    #   bucket: user-upload
    #   endpoints: [...]
    #   mirror: { scheme: fs, root: "/asset" }
    #   mirror_mode: write        # write (read-through to the mirror) | write_only
  
  local_masterdata:
    enabled: false            # legacy/dev only; production should use sekai.remote_sync instead
    allow_fallback: false     # when true, DB gaps may fall back to local files
    allow_leaks: false        # when true, unopened event/worldbloom deck queries may fall back to local files
    dir: ""
    refresh_interval: "-1s"

  deck_recommend:
    enabled: true
    disable: true
    disable_reason: ""
    service_base_url: "http://127.0.0.1:3000"    # required for deck recommend auto; runtime is HTTP-service-only
    # targets:
    #   - name: "vm100"        # same name as drawing target => share one machine queue
    #     base_url: "http://127.0.0.1:3000"
    #     concurrency: 8
    #   - name: "vm101"
    #     base_url: "http://127.0.0.1:3001"
    #     concurrency: 8
    masterdata_dir: "/data/HarukiServices/alpha/Data/master/haruki-sekai-master" # root dir; Cloud will resolve the region subdir (not needed when registry_url is set)
    masterdata_refresh_interval: "5m" # re-check mounted masterdata files (or the registry manifest) and ask deck-service to reload
    registry_url: ""          # Haruki master registry base URL; when set, deck-service pulls master data from it (POST /update/masterdata/registry) and Cloud only tracks the published contentHash
    timeout: "10s"
    max_retries: 3            # HTTP-level retry count for transient failures
    retry_wait_time: "1s"     # wait between retries
    default_algs: ["dfs", "ga"]

security:
  # Security events (auth_failed, replay_detected, rate_limited,
  # build_rejected, session_revoked, login_source_changed, client_changed,
  # policy_unavailable) are always logged with event=security. When one kind
  # crosses alert_threshold occurrences for the same bot / source inside
  # alert_window, one JSON alert is POSTed here (ERROR log only when empty).
  alert_webhook_url: ""
  alert_threshold: 5
  alert_window: 10m
