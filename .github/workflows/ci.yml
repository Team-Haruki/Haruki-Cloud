name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build
        run: go build -mod=readonly ./...

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Build staticcheck
        run: go build -mod=readonly -modfile=.github/tools/go.mod -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck

      - name: Run staticcheck
        run: |
          "$RUNNER_TEMP/staticcheck" ./...

      - name: Test
        run: go test -mod=readonly -race -count=1 ./...
