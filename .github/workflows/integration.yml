name: Integration

# Manual only. ./integration/... talks to a RUNNING Haruki-Cloud server (HARUKI_TEST_BASE_URL,
# default http://127.0.0.1:6666) with a provisioned bot (HARUKI_TEST_BOT_*) and its own
# users/pjsk databases (HARUKI_TEST_USERS_DSN / HARUKI_TEST_PJSK_DSN). This workflow starts
# Postgres and Redis but not that server, so it only passes once a step that boots one is
# added. It is kept out of ci.yml so it can never turn "CI OK" red.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    uses: seiunx-dev/ci-templates/.github/workflows/go-ci.yml@v1
    with:
      staticcheck: "off"
      tidy-check: false
      test-packages: ./integration/...
      test-args: -count=1 -timeout=10m
      postgres-image: postgres:18.3
      redis-image: redis:7
      # HARUKI_TEST_DB_URL / HARUKI_TEST_REDIS_URL carried over from the old integration.yml
      # (no Go code reads them today).
      env: |
        HARUKI_RUN_INTEGRATION=1
        HARUKI_IMAGECACHE_TEST_DSN=postgres://postgres:postgres@127.0.0.1:5432/test?sslmode=disable
        HARUKI_TEST_DB_URL=host=localhost port=5432 user=postgres password=postgres dbname=test sslmode=disable
        HARUKI_TEST_REDIS_URL=localhost:6379
