other = "{{.Region}}未找到对应的活动\n查询其他区服的活动请加区服前缀，例如 /cn查活动"

[event.unreleased]
description = "查询的活动还没有开始。"
other = "该活动还未开始"

[event.no_ongoing]
description = "需要当前活动的指令，但当前没有进行中的活动。"
other = "当前没有进行中的活动"

[event.no_match]
