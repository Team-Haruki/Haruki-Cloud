other = "已将全局默认绑定设为 {{.Account}}"

[account.default.set_region]
description = "设置某个区服的默认绑定成功。占位符：Region=区服显示名；Account=账号显示名。"
other = "已将{{.Region}}默认绑定设为 {{.Account}}"

[account.default.set_plain]
description = "设置默认绑定成功但拿不到账号详情时的回复（正常情况下不会出现）。"
other = "已设置默认绑定"

[account.default.cleared_global]
description = "取消全局默认绑定成功。占位符：Account=原来的全局默认绑定的账号显示名。"
other = "已取消全局默认绑定 {{.Account}}"

[account.default.cleared_region]
description = "取消某个区服的默认绑定成功。占位符：Region=区服显示名；Account=原来的区服默认绑定的账号显示名。"
other = "已取消{{.Region}}默认绑定 {{.Account}}"

[account.default.cleared_plain]
description = "取消默认绑定成功但拿不到账号详情时的回复（正常情况下不会出现）。"
other = "已取消默认绑定"

# ---- 可见性（/隐藏id、/展示抓包、/隐藏烤森抓包 等） ----

[account.visibility.hide_uid]
description = "/隐藏id 成功：个人信息和查询结果里不再显示完整的游戏 UID。占位符：Account=账号显示名（UID 已打码）。"
other = "已隐藏 {{.Account}} 的游戏 UID"

[account.visibility.show_uid]
description = "/展示id 成功：个人信息和查询结果里显示完整的游戏 UID。占位符：Account=账号显示名（完整 UID）。"
other = "已展示 {{.Account}} 的游戏 UID"

[account.visibility.hide_suite]
description = "/隐藏抓包 成功：其他人不能再查询该账号的抓包数据。占位符：Account=账号显示名。"
other = "已隐藏 {{.Account}} 的抓包数据"

[account.visibility.show_suite]
description = "/展示抓包 成功：恢复展示该账号的抓包数据。占位符：Account=账号显示名。"
other = "已展示 {{.Account}} 的抓包数据"

[account.visibility.hide_mysekai]
description = "/隐藏烤森抓包 成功：其他人不能再查询该账号的烤森数据。占位符：Account=账号显示名。"
other = "已隐藏 {{.Account}} 的烤森数据"

[account.visibility.show_mysekai]
