[alias.ambiguous]
description = "别名或名称匹配到多个歌曲或角色，下面逐行列出候选。占位符：Kind=别名类型（alias.kind.*）；Candidates=候选列表，每行一个（alias.ambiguous_candidate 或 music.ambiguous_candidate）。"
other = "匹配到多个{{.Kind}}，请改用 ID：\n{{.Candidates}}"

