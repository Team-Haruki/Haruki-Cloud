sonar.projectKey=Team-Haruki_Haruki-Cloud
sonar.organization=team-haruki
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*_test.go,database/**/*,ent/**/*
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=database/**/*,ent/**/*
sonar.cpd.exclusions=database/**/*,ent/**/*

# Test functions intentionally exercise many independent branches in one table.
# Production code remains fully subject to the cognitive-complexity rule.
sonar.issue.ignore.multicriteria=testCognitiveComplexity
sonar.issue.ignore.multicriteria.testCognitiveComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testCognitiveComplexity.resourceKey=**/*_test.go
