# 虚拟 Live：查虚拟 Live。

[vlive.query_required]
description = "查虚拟 Live 没有写要查的 Live。"
other = "请写要查询的虚拟 Live"

[vlive.not_found]
description = "找不到对应的虚拟 Live。"
other = "未找到对应的虚拟 Live"

[vlive.none]
description = "查虚拟 Live（/vlive）时当前没有进行中或即将开始的虚拟 Live。"
other = "当前没有虚拟 Live"

[vlive.solo.none]
description = "查个人虚拟 Live 时该区服没有个人虚拟 Live。占位符：Region=区服显示名。"
other = "{{.Region}}当前没有个人虚拟 Live"

[vlive.solo.not_found]
description = "查个人虚拟 Live 时找不到用户写的 Live。占位符：UserQuery=用户输入的查询词（超过 30 字会截断）。"
other = "未找到个人虚拟 Live：“{{.UserQuery}}”\n发送 /vlive 查看虚拟 Live 列表"

[vlive.solo.not_found_no_echo]
description = "vlive.solo.not_found 的不回显形式：客户端没有开启参数回显（enableParamEcho）时使用，不显示用户输入。"
other = "未找到对应的个人虚拟 Live\n发送 /vlive 查看虚拟 Live 列表"

[vlive.fallback_name]
description = "虚拟 Live 列表图和详情图里，Live 没有名称时显示的名称。占位符：ID=虚拟 Live ID。"
other = "虚拟 Live #{{.ID}}"

[vlive.image.type.solo_virtual_live]
description = "图片：虚拟 Live 列表图和详情图里，虚拟 Live 类型的标签（普通虚拟 Live 不显示）。渲染服务按同时发送的原始类型取这段文字，只用于显示。"
other = "个人 Live"

[vlive.image.type.virtual_message]
description = "图片：虚拟 Live 列表图和详情图里，虚拟 Live 类型的标签（普通虚拟 Live 不显示）。渲染服务按同时发送的原始类型取这段文字，只用于显示。"
other = "Virtual Message"

[vlive.image.type.cheerful_carnival]
