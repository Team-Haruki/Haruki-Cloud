[account.settings.arrest_difficulty_set]
description = "/逮捕难度 设置成功，列出开启和关闭的难度。占位符：Enabled=开启的难度，用“、”分隔（EASY……APPEND），没有时为 account.settings.none；Disabled=关闭的难度，格式同 Enabled。"
other = "已设置逮捕难度\n开启：{{.Enabled}}\n关闭：{{.Disabled}}"

[account.settings.none]
description = "列表为空时的占位文字，用在 account.settings.arrest_difficulty_set 里。"
