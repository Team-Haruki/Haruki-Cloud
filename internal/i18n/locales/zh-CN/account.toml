# 账号：绑定、解绑、默认绑定、绑定列表、验证、可见性和个人设置（时区、逮捕难度、谱面样式、
# 模块化个人信息、个人信息背景）的成功回复，以及 Bot 客户端接口（登录、会话、注销、统计、
# 群绑定检查）返回给 Bot 运营者的 message。
# 账号相关的错误提示在 binding.toml，封禁相关在 moderation.toml。

# ---- 绑定列表（/绑定列表、/绑定交换） ----

[account.list.header]
description = "/绑定列表 不带区服时的第一行，下面每行一个账号（account.list.item*）。u序号是用户之后在指令里写的 u1、u2。"
other = "已绑定的游戏账号（u序号按全部账号编号）："

[account.list.header_region]
description = "/<区服代码>绑定列表 的第一行，下面每行一个该区服的账号（account.list.item*）。占位符：Region=区服显示名，例如“日服(JP)”。"
other = "{{.Region}}已绑定的游戏账号（u序号按该区服编号）："

[account.list.item]
description = "绑定列表里的一行，该账号不是任何默认绑定。占位符：Index=u序号的数字；Account=账号显示名，例如“[日服(JP)] 123***789”。"
other = "u{{.Index}} {{.Account}}"

[account.list.item_marked]
description = "绑定列表里的一行，该账号是默认绑定。占位符：Index=u序号的数字；Account=账号显示名，例如“[日服(JP)] 123***789”；Marks=默认绑定标记，用“、”分隔（account.mark.*）。"
other = "u{{.Index}} {{.Account}}（{{.Marks}}）"

[account.mark.global_default]
description = "绑定列表、验证列表里的标记：该账号是全局默认绑定。用在 account.list.item_marked、account.verify_list.item_marked 的 Marks 占位符里。"
other = "全局默认"

[account.mark.region_default]
description = "绑定列表、验证列表里的标记：该账号是某个区服的默认绑定。用在 Marks 占位符里。占位符：Region=区服显示名。"
other = "{{.Region}}默认"

[account.swap.done]
description = "/绑定交换 成功，下面接交换后的绑定列表。占位符：Left=用户写的第一个 u序号，例如“u1”；Right=用户写的第二个 u序号；List=交换后的绑定列表（account.list.*）。"
other = "已交换 {{.Left}} 和 {{.Right}} 的顺序\n{{.List}}"

[account.swap.done_region]
description = "/<区服代码>绑定交换 成功，下面接交换后该区服的绑定列表。占位符：Region=区服显示名；Left=用户写的第一个 u序号；Right=用户写的第二个 u序号；List=交换后的绑定列表（account.list.*）。"
other = "已交换{{.Region}}账号 {{.Left}} 和 {{.Right}} 的顺序\n{{.List}}"

# ---- 绑定、解绑 ----

[account.bind.done]
description = "/绑定 成功的第一行，后面可能接 account.bind.note_*。占位符：Account=账号显示名，UID 中间打码，例如“[日服(JP)] 123***789”；Name=游戏内昵称（玩家自己设置的原文）。"
other = "已绑定 {{.Account}}（{{.Name}}）"

[account.bind.done_plain]
description = "/绑定 成功但拿不到账号详情时的回复（正常情况下不会出现）。"
other = "已绑定游戏账号"

[account.bind.note_already_bound]
description = "/绑定 的附加行：这个账号之前已经绑定过，这次没有新增绑定。"
other = "这个账号之前已经绑定过，没有重复添加"

[account.bind.note_global_default]
description = "/绑定 的附加行：这是用户的第一个账号，已自动设为全局默认绑定。"
other = "已自动设为全局默认绑定"

[account.bind.note_region_default]
description = "/绑定 的附加行：这是用户在该区服的第一个账号，已自动设为该区服的默认绑定。占位符：Region=区服显示名。"
other = "已自动设为{{.Region}}默认绑定"

[account.bind.note_multiple_regions]
description = "/绑定 的附加行：同一个游戏 UID 在多个区服都查到了玩家，按区服顺序绑定了第一个。"
other = "这个游戏 UID 在多个区服都存在，已按 jp、cn、tw、kr、en 的顺序绑定第一个找到的区服"

[account.unbind.done]
description = "/解绑 成功的第一行，后面可能接 account.unbind.reassigned_*。占位符：Account=被解绑的账号显示名。"
other = "已解绑 {{.Account}}"

[account.unbind.done_plain]
description = "/解绑 成功但拿不到账号详情时的回复（正常情况下不会出现）。"
other = "已解绑游戏账号"

[account.unbind.reassigned_global]
description = "/解绑 的附加行：被解绑的账号原来是全局默认绑定，已改用另一个账号。占位符：Account=新的全局默认绑定的账号显示名。"
other = "已将全局默认绑定改为 {{.Account}}"

[account.unbind.reassigned_region]
description = "/解绑 的附加行：被解绑的账号原来是该区服的默认绑定，已改用另一个账号。占位符：Region=区服显示名；Account=新的区服默认绑定的账号显示名。"
other = "已将{{.Region}}默认绑定改为 {{.Account}}"

# ---- 默认绑定（/默认绑定、/取消默认绑定） ----

[account.default.set_global]
