# 数据状态：/sud（抓包状态）、/msd（烤森数据状态）和烤森数据过期提示用同一种结构：
# 第一行“<账号> 的<数据>”，第二行 profile.data_status.uploaded。

[profile.data_status.suite]
description = "/sud（抓包状态）的回复。占位符：Account=账号显示名，例如“[日服(JP)] 123***789”；Uploaded=上传时间行（profile.data_status.uploaded 或 profile.data_status.uploaded_unknown）。"
other = "{{.Account}} 的抓包数据（Suite）\n{{.Uploaded}}"

[profile.data_status.mysekai]
description = "/msd（烤森数据状态）的回复。占位符：Account=账号显示名，例如“[日服(JP)] 123***789”；Uploaded=上传时间行（profile.data_status.uploaded 或 profile.data_status.uploaded_unknown）。"
other = "{{.Account}} 的烤森（MySekai）数据\n{{.Uploaded}}"

[profile.data_status.mysekai_expired]
description = "烤森指令（地图、资源等）发现烤森数据已过期。结构与 /msd 相同，后面两行说明怎么办。占位符：Account=账号显示名，例如“[日服(JP)] 123***789”；Uploaded=上传时间行（profile.data_status.uploaded 或 profile.data_status.uploaded_unknown）。"
other = "{{.Account}} 的烤森（MySekai）数据已过期\n{{.Uploaded}}\n要查看最新数据，请在 Haruki 工具箱重新上传烤森数据\n要继续查看已过期的数据，请在指令后加上“force”"

[profile.data_status.mysekai_expired_current]
description = "同 profile.data_status.mysekai_expired，但不知道是哪个绑定账号。占位符：Uploaded=上传时间行（profile.data_status.uploaded 或 profile.data_status.uploaded_unknown）。"
other = "当前绑定账号的烤森（MySekai）数据已过期\n{{.Uploaded}}\n要查看最新数据，请在 Haruki 工具箱重新上传烤森数据\n要继续查看已过期的数据，请在指令后加上“force”"

[profile.data_status.uploaded]
description = "数据状态回复的上传时间行。占位符：Time=上传时间（format.time.datetime），例如“2026-10-09 14:05 (UTC+8)”；Age=距今多久（profile.data_status.age.*），例如“3小时20分钟前”。"
