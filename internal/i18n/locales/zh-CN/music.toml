# 以下是画进图片的文字（music.image.*）。

[music.image.board.title]
description = "图片：歌曲排行（/歌曲排行）的标题。占位符：Board=排行名称（music.image.board.name 或 name_live）；Target=排序指标（music.image.board.target_*）；Order=排序方向（music.image.board.order_*）；Page=页码（format.page），例如“第 1/3 页”。"
