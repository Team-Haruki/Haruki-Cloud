description = "查虚拟 Live 没有写要查的 Live。"
other = "请写要查询的虚拟 Live"

[vlive.not_found]
description = "找不到对应的虚拟 Live。"
other = "未找到对应的虚拟 Live"

[vlive.none]
description = "查虚拟 Live（/vlive）时当前没有进行中或即将开始的虚拟 Live。"
