# 活动：查活动、活动列表、活动记录、活动规划。

[event.not_found_in_region]
description = "在某个区服找不到指定 ID 的活动。占位符：Region=区服显示名；ID=活动 ID。"
other = "{{.Region}}未找到活动 {{.ID}}"

[event.query_required]
description = "查活动但没有写参数。"
other = "请写要查询的活动"

[event.not_found]
description = "查活动时找不到匹配的活动（不确定区服时）。"
other = "未找到对应的活动"

[event.not_found_in_region_hint]
