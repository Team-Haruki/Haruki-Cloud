name: Release
# The version comes from the tag only (version.Version is "dev" in source and set with
# -ldflags -X), so the gate uses version-source: none and dry runs build v0.0.0-dev.<sha7>.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1
    with:
      version-source: none

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/go-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      binaries: haruki-server=.
      # default ldflags: -s -w -X {module}/version.Version={tag} (v3.7.5, as before)

  docker:
    name: Docker
    needs: gate
    if: needs.gate.outputs.is-tag == 'true' # dry runs never push images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      # Built, not promoted: VERSION (the tag without "v", as before) is compiled into the
      # binary, and the main image carries main-<sha7>. Only the final `go build` layer misses
      # the main-written :buildcache.
      version-build-arg: VERSION
      cache-backend: registry
      cache-mode: max

  publish:
    name: GitHub Release
    needs: [gate, binaries, docker]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
